[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilthermopy"
authors = [
    {name = "Ivan Yu. Chernyshov", email = "ivan.chernyshoff@gmail.com"}
]
maintainers = [
    {name = "Ivan Yu. Chernyshov", email = "ivan.chernyshoff@gmail.com"}
]
description = "Unofficial ILThermo 2.0 access and SMILES enrichment for ionic-liquid data workflows"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md"}
keywords = ["ionic liquids", "ilthermo", "thermodynamics", "cheminformatics", "smiles", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "importlib-resources>=1.1.0; python_version<'3.9'",
  "requests",
  "pandas"
]
requires-python = ">= 3.7"
dynamic = ["version"]

[project.urls]
Documentation = "https://mucommons.github.io/ILThermoPy/"
Repository = "https://github.com/muCommons/ILThermoPy"
Issues = "https://github.com/muCommons/ILThermoPy/issues"
Changelog = "https://mucommons.github.io/ILThermoPy/source/changelog.html"

[tool.setuptools.dynamic]
version = {attr = "ilthermopy.__version__"}


